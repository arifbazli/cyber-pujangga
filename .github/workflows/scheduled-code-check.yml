name: Scheduled Code Health Check

on:
  schedule:
    # Every Monday at 03:00 UTC — adjust to taste
    - cron: '0 3 * * 1'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyber-pujangga-site

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cyber-pujangga-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --- Type check (astro check) ---
      - name: Run astro check
        id: typecheck
        run: npm run check > typecheck-output.txt 2>&1
        continue-on-error: true

      # --- Lint/format check (Biome, non-destructive) ---
      - name: Run Biome check
        id: lint
        run: npx biome check . > biome-output.txt 2>&1
        continue-on-error: true

      # --- Build check ---
      - name: Run build
        id: build
        run: npm run build > build-output.txt 2>&1
        continue-on-error: true

      # --- Auto-fix lint/format issues (safe fixes only) and open a PR ---
      - name: Auto-fix lint issues
        if: steps.lint.outcome == 'failure'
        run: npx biome check --write .
        continue-on-error: true

      # Capture what's left after the safe auto-fix, so leftover issues can be reported
      - name: Re-check lint after auto-fix
        id: lint-remaining
        if: steps.lint.outcome == 'failure'
        run: npx biome check . > biome-remaining-output.txt 2>&1
        continue-on-error: true

      - name: Open PR with auto-fixes
        if: steps.lint.outcome == 'failure'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "fix: automated Biome lint/format fixes"
          title: "chore: automated lint fixes (scheduled check)"
          body: |
            Auto-generated by the scheduled code health check workflow.

            Biome applied its safe automatic fixes. Some issues may remain
            (unsafe fixes or errors needing a manual decision) — see the
            tracked health-check issue for those, if one was opened.

            Please review the diff before merging.
          branch: automated/lint-fixes
          delete-branch: true
          labels: automated

      # --- Create/update an issue for problems that can't be auto-fixed ---
      - name: Report non-auto-fixable errors
        if: steps.typecheck.outcome == 'failure' || steps.build.outcome == 'failure' || steps.lint-remaining.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            function readIfExists(p) {
              try { return fs.readFileSync(p, 'utf8'); } catch { return null; }
            }

            const dir = 'cyber-pujangga-site';
            const typecheckOut = readIfExists(path.join(dir, 'typecheck-output.txt'));
            const buildOut = readIfExists(path.join(dir, 'build-output.txt'));
            const lintRemainingOut = readIfExists(path.join(dir, 'biome-remaining-output.txt'));

            let body = '## Scheduled code health check found issues\n\n';
            if ('${{ steps.typecheck.outcome }}' === 'failure' && typecheckOut) {
              body += '### Type check errors (`npm run check`)\n```\n' + typecheckOut.slice(-4000) + '\n```\n\n';
            }
            if ('${{ steps.build.outcome }}' === 'failure' && buildOut) {
              body += '### Build errors (`npm run build`)\n```\n' + buildOut.slice(-4000) + '\n```\n\n';
            }
            if ('${{ steps.lint-remaining.outcome }}' === 'failure' && lintRemainingOut) {
              body += '### Remaining lint issues after auto-fix (`biome check`)\n'
                + 'These need a manual decision — either an unsafe fix Biome won\'t apply automatically, '
                + 'or a real issue (e.g. `any` types, invalid CSS properties) that needs a human judgment call.\n'
                + '```\n' + lintRemainingOut.slice(-4000) + '\n```\n\n';
            }
            body += '_This issue was created automatically. It will be updated on the next run if the problem persists, rather than duplicated._';

            const label = 'automated-health-check';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            if (existing.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Automated check: type/build/lint errors detected',
                body,
                labels: [label],
              });
            }
